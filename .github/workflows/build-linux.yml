name: Build Linux amd64

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build frontend
        run: npm ci && npm run build

      - name: Build Linux binary
        env:
          CGO_ENABLED: 1
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          go build -ldflags="-s -w -X clawbench/internal/version.Version=$VERSION" -o clawbench ./cmd/server

      - name: Verify binary
        run: |
          file clawbench
          ./clawbench --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawbench-linux-amd64
          path: clawbench
          retention-days: 30
